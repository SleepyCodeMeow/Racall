name: Test and package desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read declared release platforms
        id: policy
        run: python3 scripts/release_policy.py --github-output "$GITHUB_OUTPUT"
  desktop:
    needs: targets
    name: desktop (${{ matrix.os }}, ${{ matrix.platform }}, ${{ matrix.arch }})
    timeout-minutes: 60
    env:
      RACALL_TARGET_ARCH: ${{ matrix.arch }}
      RACALL_TARGET_PLATFORM: ${{ matrix.platform }}
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - name: Restore native ARM64 OpenSSL build
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        id: native-crypto-cache
        uses: actions/cache/restore@v4
        with:
          path: build/arm64/vcpkg
          key: native-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare_windows_arm64.ps1') }}
      - name: Prepare native Windows ARM64 crypto toolchain
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/prepare_windows_arm64.ps1
      - name: Cache verified native ARM64 OpenSSL build
        if: runner.os == 'Windows' && matrix.arch == 'arm64' && steps.native-crypto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/arm64/vcpkg
          key: native-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare_windows_arm64.ps1') }}
      - name: Prepare Intel macOS crypto source build
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          openssl_notice=$(find -L "$(brew --prefix openssl@3)" -type f -iname 'LICENSE.txt' -print -quit)
          test -n "$openssl_notice" && test -s "$openssl_notice"
          echo "RACALL_OPENSSL_NOTICE=$openssl_notice" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
      - run: npm ci
      - run: uv sync --frozen
      - name: Verify native Node and Python architecture
        run: uv run python scripts/check_native_arch.py
      - run: node --test scripts/test-native-target.cjs
      - run: npm test -- -q
      - run: npm run lint
      - run: npm run check:installer-catalog
      - run: npm run test:i18n
      - run: npm run check:release
      - run: uv run python scripts/evaluate_model.py
      - run: npm run build
      - run: npm run typecheck
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native language picker
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/check-installer-ui.ps1
      - name: Check packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Check packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Check installer (Windows and macOS)
        if: runner.os != 'Linux'
        run: node scripts/check-installer.cjs
      - name: Check installer (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/check-installer.cjs
      - name: Verify candidate packages and write checksums
        run: uv run python scripts/check_candidate_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: Racall-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
            release/BUILD.json
          if-no-files-found: error
      - name: Save diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/**/result.json
            test-results/**/failure.png
            test-results/**/backend.log
            test-results/**/process.log
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Racall-*
          path: release
          merge-multiple: true
      - name: Publish complete release with checksums
        run: python3 scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
